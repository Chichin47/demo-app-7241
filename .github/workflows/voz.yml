name: prueba de voz

# Prueba suelta, para arrancar a mano desde la pestaña Actions. NO publica
# nada en ninguna página: solo comprueba tres cosas contra el servicio de voz,
# que es justo lo que no se puede probar desde otro lado.
#
#   1. Que la clave VOZ_API_KEY sirve.
#   2. Cuántos créditos quedan en la cuenta (esta consulta no gasta nada).
#   3. Que la voz clonada VEXVIP está en la biblioteca y con qué identificador.
#   4. Que el servicio devuelve un audio de verdad, que queda para escuchar.
#
# A propósito no lleva grupo de concurrencia: así corre al toque, en paralelo
# con el turno del bot, sin hacer cola detrás de él ni cortarlo.
on:
  workflow_dispatch:

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Hace falta para medir cuánto dura el audio. Sin esto la muestra sale
      # igual, pero no se sabría si dura lo que tiene que durar.
      - name: Instalar ffmpeg
        run: |
          if command -v ffprobe >/dev/null; then
            echo "ffmpeg ya estaba."
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      # Se mira antes y después de hablar, así se ve de paso cuánto costó la
      # frase de prueba. Consultar el saldo es gratis.
      - name: Créditos que quedan
        continue-on-error: true
        env:
          VOZ_API_KEY: ${{ secrets.VOZ_API_KEY }}
        run: python voz.py creditos

      - name: Buscar la voz en la biblioteca
        env:
          VOZ_API_KEY: ${{ secrets.VOZ_API_KEY }}
          VOZ_NOMBRE: "VEXVIP"
        run: python voz.py voces clone

      - name: Decir una frase de prueba
        env:
          VOZ_API_KEY: ${{ secrets.VOZ_API_KEY }}
          VOZ_NOMBRE: "VEXVIP"
        run: |
          python voz.py "Esto es una prueba de la voz del bot. Si escuchas esta frase completa, el servicio responde bien y la voz clonada es la correcta. Ya se puede publicar en video." /tmp/muestra.mp3
          ls -l /tmp/muestra.mp3
          python voz.py creditos

      # La muestra queda colgada del resumen de la corrida, para bajarla y
      # escucharla desde el celular o la computadora.
      - name: Dejar la muestra para escuchar
        uses: actions/upload-artifact@v4
        with:
          name: muestra-de-voz
          path: /tmp/muestra.mp3
