name: build

on:
  workflow_dispatch:
  schedule:
    # Este cron NO es el que marca el ritmo de trabajo: el ritmo lo marca el
    # bucle de runner.py, que barre cada pocos minutos durante toda la corrida.
    # El cron solo sirve de red de seguridad: si por lo que sea la cadena de
    # turnos se rompe, en menos de 10 min vuelve a arrancar sola.
    - cron: "*/10 * * * *"

permissions:
  contents: write

# El turno que está corriendo nunca se cancela; el que llega se queda esperando
# y arranca en el mismo instante en que el anterior termina. Así se encadenan
# los turnos y la cobertura es continua.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  run:
    # Interruptor de apagado: variable de repositorio  OFF = 1
    if: ${{ vars.OFF != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load config
        env:
          CONFIG_B64: ${{ secrets.CONFIG_B64 }}
        run: |
          if [ -z "$CONFIG_B64" ]; then
            echo "Falta el secreto CONFIG_B64." >&2
            exit 1
          fi
          printf '%s' "$CONFIG_B64" | base64 -d > "$RUNNER_TEMP/cfg.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg.env"
          rm -f "$RUNNER_TEMP/cfg.env"
          echo "Config cargada."

      # Segundo sobre, opcional. Sirve para cambiar solo un par de valores
      # (por ejemplo los identificadores de las páginas) sin tener que rehacer
      # el sobre grande. Lo que venga acá pisa lo que vino en CONFIG_B64.
      - name: Load config extra
        env:
          CONFIG2_B64: ${{ secrets.CONFIG2_B64 }}
        run: |
          if [ -z "$CONFIG2_B64" ]; then
            echo "Sin sobre extra."
            exit 0
          fi
          printf '%s' "$CONFIG2_B64" | base64 -d > "$RUNNER_TEMP/cfg2.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg2.env"
          rm -f "$RUNNER_TEMP/cfg2.env"
          echo "Sobre extra cargado."

      # Siempre se parte de la ÚLTIMA versión del estado que hay en el
      # repositorio, no de la del commit con el que arrancó este turno.
      # Motivo: las corridas programadas se crean con la foto del repositorio
      # del momento en que entran a la cola, y como el turno anterior dura casi
      # una hora, esa foto ya está vieja cuando por fin arrancan. Si se
      # restaurara de ahí, el turno no se enteraría de lo que publicó el turno
      # anterior y lo volvería a publicar (posts duplicados).
      - name: Restore state
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main || true
          if git show origin/main:data/store.b64 > "$RUNNER_TEMP/remote.b64" 2>/dev/null; then
            cp "$RUNNER_TEMP/remote.b64" data/store.b64
            echo "Estado tomado de la última versión del repositorio."
          else
            echo "No se pudo leer el estado remoto; se usa el del commit."
          fi
          python tools/pack.py unpack

      # Paso corto y aparte: su log se ve al instante, sin esperar al proceso
      # largo. Nunca corta el turno aunque falle.
      - name: Check
        continue-on-error: true
        run: python tools/diag.py

      - name: Run
        env:
          # El turno dura 55 min y el job corta a los 65: sobra margen para
          # que el cierre y el guardado terminen tranquilos.
          MAX_RUNTIME_SECONDS: "3300"
          QUIET_LIFECYCLE: "1"
        run: python runner.py

      # Al guardar nunca se pisa lo que haya en el repositorio: se UNE. Lo
      # publicado queda siendo la suma de las dos versiones, así ningún post
      # se pierde de la lista y por lo tanto ninguno se repite. Si otro turno
      # guardó primero, se vuelve a intentar sobre lo nuevo.
      - name: Save state
        if: always()
        run: |
          python tools/pack.py pack
          cp data/store.b64 "$RUNNER_TEMP/local.b64"
          cp tools/merge.py "$RUNNER_TEMP/merge.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main || true
            git checkout -f -B guardado origin/main
            git show origin/main:data/store.b64 > "$RUNNER_TEMP/remote.b64" 2>/dev/null || : > "$RUNNER_TEMP/remote.b64"
            python "$RUNNER_TEMP/merge.py" "$RUNNER_TEMP/remote.b64" "$RUNNER_TEMP/local.b64" data/store.b64
            git add -f data/store.b64
            if git diff --cached --quiet; then
              echo "Sin cambios."
              exit 0
            fi
            git commit -m "chore: update data [skip ci]"
            if git push origin HEAD:main; then
              echo "Estado guardado."
              exit 0
            fi
            echo "Otro turno guardó primero; reintento ($intento)."
            sleep 5
          done
          echo "No se pudo guardar el estado." >&2
