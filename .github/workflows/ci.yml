name: build

on:
  workflow_dispatch:
  # Cualquier cambio subido al repositorio arranca el bot al instante. Sirve
  # de arranque manual: con solo subir algo vuelve a la vida, sin esperar al
  # programador. (Los guardados del propio bot NO cuentan: los hace con la
  # llave interna de GitHub, y esos empujes nunca disparan un turno nuevo.)
  push:
    branches: [main]
  schedule:
    # Este cron NO es el que marca el ritmo de trabajo: el ritmo lo marca el
    # bucle de runner.py, que barre cada pocos minutos durante toda la corrida.
    # El cron solo sirve de red de seguridad: si por lo que sea la cadena de
    # turnos se rompe, vuelve a arrancar sola. Ojo: GitHub no garantiza que
    # los turnos programados salgan puntuales (a veces se saltan varios
    # seguidos cuando está cargado), por eso el turno dura casi 6 horas: así
    # se depende lo menos posible de este cron.
    - cron: "*/10 * * * *"

permissions:
  contents: write

# El turno que está corriendo nunca se cancela; el que llega se queda esperando
# y arranca en el mismo instante en que el anterior termina. Así se encadenan
# los turnos y la cobertura es continua.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  run:
    # Interruptor de apagado: variable de repositorio  OFF = 1
    if: ${{ vars.OFF != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # El relevo se pide AL PRINCIPIO del turno, no al final. Así queda uno
      # esperando en la puerta desde el minuto cero: pase lo que pase con este
      # turno (que se caiga, que lo corten, que se quede colgado), el siguiente
      # entra solo apenas se libere el puesto. Sin esto dependemos de que el
      # programador de GitHub dispare, y GitHub no garantiza que lo haga.
      - name: Queue next
        continue-on-error: true
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          if [ -z "$RELAY_TOKEN" ]; then
            echo "Sin llave de relevo; queda solo el programador de GitHub."
            exit 0
          fi
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$codigo" = "204" ]; then
            echo "Relevo encolado: el siguiente turno ya está esperando."
          else
            echo "No se pudo encolar el relevo (código $codigo)."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load config
        env:
          CONFIG_B64: ${{ secrets.CONFIG_B64 }}
        run: |
          if [ -z "$CONFIG_B64" ]; then
            echo "Falta el secreto CONFIG_B64." >&2
            exit 1
          fi
          printf '%s' "$CONFIG_B64" | base64 -d > "$RUNNER_TEMP/cfg.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg.env"
          rm -f "$RUNNER_TEMP/cfg.env"
          echo "Config cargada."

      # Segundo sobre, opcional. Sirve para cambiar solo un par de valores
      # (por ejemplo los identificadores de las páginas) sin tener que rehacer
      # el sobre grande. Lo que venga acá pisa lo que vino en CONFIG_B64.
      - name: Load config extra
        env:
          CONFIG2_B64: ${{ secrets.CONFIG2_B64 }}
        run: |
          if [ -z "$CONFIG2_B64" ]; then
            echo "Sin sobre extra."
            exit 0
          fi
          printf '%s' "$CONFIG2_B64" | base64 -d > "$RUNNER_TEMP/cfg2.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg2.env"
          rm -f "$RUNNER_TEMP/cfg2.env"
          echo "Sobre extra cargado."

      # Ajustes de ritmo que se llevan acá, a la vista, en vez de dentro de los
      # sobres cifrados: así se cambian con un solo empuje al repositorio y sin
      # tener que rehacer ningún secreto. Como se escriben DESPUÉS de los dos
      # sobres, este valor es el que manda.
      - name: Ritmo
        run: |
          # Separación mínima entre publicaciones automáticas, en minutos.
          echo "MIN_MINUTES_BETWEEN_POSTS=10" >> "$GITHUB_ENV"
          echo "Separación mínima entre publicaciones: 10 min."

      # Página 2 (la que recibe y publica). El número de la página va a la
      # vista porque no es secreto; la llave viene del secreto PAGE2_TOKEN.
      # Van juntos a propósito: si falta la llave NO se cambia la página, así
      # nunca se intenta publicar en la página nueva con la llave vieja.
      - name: Pagina 2
        env:
          PAGE2_TOKEN: ${{ secrets.PAGE2_TOKEN }}
        run: |
          if [ -n "$PAGE2_TOKEN" ]; then
            echo "::add-mask::$PAGE2_TOKEN"
            echo "PAGE_ID_BACKUP=179820098545682" >> "$GITHUB_ENV"
            echo "PAGE_TOKEN_BACKUP=$PAGE2_TOKEN" >> "$GITHUB_ENV"
            echo "Página 2: Universo Reality Tv Mexico Lives (179820098545682)."
          else
            echo "Sin secreto PAGE2_TOKEN: se queda la página 2 anterior."
          fi

      # Siempre se parte de la ÚLTIMA versión del estado que hay en el
      # repositorio, no de la del commit con el que arrancó este turno.
      # Motivo: las corridas programadas se crean con la foto del repositorio
      # del momento en que entran a la cola, y como el turno anterior dura casi
      # una hora, esa foto ya está vieja cuando por fin arrancan. Si se
      # restaurara de ahí, el turno no se enteraría de lo que publicó el turno
      # anterior y lo volvería a publicar (posts duplicados).
      - name: Restore state
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main || true
          if git show origin/main:data/store.b64 > "$RUNNER_TEMP/remote.b64" 2>/dev/null; then
            cp "$RUNNER_TEMP/remote.b64" data/store.b64
            echo "Estado tomado de la última versión del repositorio."
          else
            echo "No se pudo leer el estado remoto; se usa el del commit."
          fi
          python tools/pack.py unpack

      # Paso corto y aparte: su log se ve al instante, sin esperar al proceso
      # largo. Nunca corta el turno aunque falle.
      - name: Check
        continue-on-error: true
        run: python tools/diag.py

      - name: Run
        env:
          # El turno dura 5 h 50 min y el job corta a las 5 h 55: sobra
          # margen para que el cierre y el guardado terminen tranquilos.
          # Turnos largos = menos relevos = menos ocasiones de que el
          # relevo no arranque. GitHub permite hasta 6 h por turno.
          MAX_RUNTIME_SECONDS: "21000"
          # Avisa por Telegram cuando arranca y cuando cierra cada turno. Con
          # turnos de 6 h son 8 avisos al día, y sirven de señal de vida: si
          # llega el 🔴 de cierre y en un par de minutos no llega el 🟢 del
          # relevo, es que el relevo no arrancó.
          QUIET_LIFECYCLE: "0"
          # La misma llave del relevo, ahora también adentro del proceso: la
          # usa el botón 🔄 Reiniciar del chat para pedirle a GitHub un turno
          # nuevo antes de cerrar este. Si falta, el reinicio igual funciona
          # (se cierra el turno y entra el relevo ya encolado).
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: python runner.py

      # Guardado final del turno. El runner ya va guardando en cada ciclo;
      # esto es el cierre, por si el último ciclo alcanzó a publicar algo.
      # Nunca pisa lo que haya en el repositorio: lo UNE (ver tools/guardar.sh).
      - name: Save state
        if: always()
        run: bash tools/guardar.sh
