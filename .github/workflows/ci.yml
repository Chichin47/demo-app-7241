name: build

on:
  workflow_dispatch:
  # Cualquier cambio subido al repositorio arranca el bot al instante. Sirve
  # de arranque manual: con solo subir algo vuelve a la vida, sin esperar al
  # programador. (Los guardados del propio bot NO cuentan: los hace con la
  # llave interna de GitHub, y esos empujes nunca disparan un turno nuevo.)
  push:
    branches: [main]
  schedule:
    # Este cron NO es el que marca el ritmo de trabajo: el ritmo lo marca el
    # bucle de runner.py, que barre cada pocos minutos durante toda la corrida.
    # El cron solo sirve de red de seguridad: si por lo que sea la cadena de
    # turnos se rompe, vuelve a arrancar sola. Ojo: GitHub no garantiza que
    # los turnos programados salgan puntuales (a veces se saltan varios
    # seguidos cuando está cargado), por eso el turno dura casi 6 horas: así
    # se depende lo menos posible de este cron.
    - cron: "*/10 * * * *"

permissions:
  contents: write

# El turno que está corriendo nunca se cancela; el que llega se queda esperando
# y arranca en el mismo instante en que el anterior termina. Así se encadenan
# los turnos y la cobertura es continua.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  run:
    # Interruptor de apagado: variable de repositorio  OFF = 1
    if: ${{ vars.OFF != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # El relevo se pide AL PRINCIPIO del turno, no al final. Así queda uno
      # esperando en la puerta desde el minuto cero: pase lo que pase con este
      # turno (que se caiga, que lo corten, que se quede colgado), el siguiente
      # entra solo apenas se libere el puesto. Sin esto dependemos de que el
      # programador de GitHub dispare, y GitHub no garantiza que lo haga.
      - name: Queue next
        continue-on-error: true
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          if [ -z "$RELAY_TOKEN" ]; then
            echo "Sin llave de relevo; queda solo el programador de GitHub."
            exit 0
          fi
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$codigo" = "204" ]; then
            echo "Relevo encolado: el siguiente turno ya está esperando."
          else
            echo "No se pudo encolar el relevo (código $codigo)."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # ffmpeg es lo que arma el video y mide el audio. Sin él NO hay reels:
      # el bot sigue publicando fotos, pero el video nunca sale. La máquina de
      # GitHub no lo trae puesto, así que se instala acá.
      #
      # Va con continue-on-error a propósito: si un día el instalador falla, el
      # turno no se cae; simplemente ese día todo sale en foto.
      - name: Instalar ffmpeg
        continue-on-error: true
        # timeout: hubo días en que apt-get de los servidores de GitHub se
        # quedaba colgado sin responder y congelaba el turno entero acá. Con
        # el límite, si apt no termina en 3 minutos se sigue sin ffmpeg (los
        # posts salen en foto) en vez de que el bot no arranque nunca.
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg ya estaba."
          else
            sudo timeout 180 apt-get install -y -qq ffmpeg \
              || { sudo timeout 60 apt-get update -qq || true
                   sudo timeout 180 apt-get install -y -qq ffmpeg || true; }
          fi
          ffmpeg -version | head -1 || echo "SIN ffmpeg: hoy todo sale en foto."

      # Los reels llevan emojis dibujados en el letrero de arriba, y para eso
      # hace falta la fuente de emojis a color. Si no se pudiera instalar, el
      # video sale igual, solo que sin los emojis: por eso nunca corta el turno.
      - name: Fuente de emojis
        continue-on-error: true
        run: sudo timeout 120 apt-get install -y -qq fonts-noto-color-emoji || true

      # Claude Code es lo que ahora escribe las descripciones y los guiones,
      # usando la llave de la suscripción en vez de la de la API. Sin esto el
      # bot no puede armar el texto de ningún post.
      #
      # NO va con continue-on-error, a diferencia de ffmpeg: sin ffmpeg los
      # posts salen en foto y el bot sigue vivo, pero sin Claude no hay ni
      # descripción ni frase sobre la imagen, o sea que no hay post. Mejor que
      # el turno se caiga acá, con el motivo escrito y a la vista, que quedarse
      # dando vueltas seis horas fallando post por post.
      - name: Instalar Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load config
        env:
          CONFIG_B64: ${{ secrets.CONFIG_B64 }}
        run: |
          if [ -z "$CONFIG_B64" ]; then
            echo "Falta el secreto CONFIG_B64." >&2
            exit 1
          fi
          printf '%s' "$CONFIG_B64" | base64 -d > "$RUNNER_TEMP/cfg.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg.env"
          rm -f "$RUNNER_TEMP/cfg.env"
          echo "Config cargada."

      # Segundo sobre, opcional. Sirve para cambiar solo un par de valores
      # (por ejemplo los identificadores de las páginas) sin tener que rehacer
      # el sobre grande. Lo que venga acá pisa lo que vino en CONFIG_B64.
      - name: Load config extra
        env:
          CONFIG2_B64: ${{ secrets.CONFIG2_B64 }}
        run: |
          if [ -z "$CONFIG2_B64" ]; then
            echo "Sin sobre extra."
            exit 0
          fi
          printf '%s' "$CONFIG2_B64" | base64 -d > "$RUNNER_TEMP/cfg2.env"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(printf '%s' "$key" | tr -d '[:space:]')"
            [ -z "$key" ] && continue
            [ "$key" = "$line" ] && continue
            if [ "${#val}" -ge 12 ]; then
              echo "::add-mask::$val"
            fi
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/cfg2.env"
          rm -f "$RUNNER_TEMP/cfg2.env"
          echo "Sobre extra cargado."

      # Ajustes de ritmo que se llevan acá, a la vista, en vez de dentro de los
      # sobres cifrados: así se cambian con un solo empuje al repositorio y sin
      # tener que rehacer ningún secreto. Como se escriben DESPUÉS de los dos
      # sobres, este valor es el que manda.
      - name: Ritmo
        run: |
          # Separación mínima entre publicaciones automáticas, en minutos.
          echo "MIN_MINUTES_BETWEEN_POSTS=10" >> "$GITHUB_ENV"
          echo "Separación mínima entre publicaciones: 10 min."

      # Página 1 (la que se LEE, donde escribís los originales): Universo
      # Reality Tv Mexico Lives, que además es donde cuelga el Instagram.
      # Como respaldo sirve el secreto PAGE2_TOKEN, que guarda su llave; al
      # arrancar el bot igual pide llaves frescas con USER_TOKEN y esas mandan.
      #
      # Cada vez que se cambia cuál es la página 1, el bot anota como "ya
      # vistas" las publicaciones que esa página ya tenía, para no republicar
      # lo viejo ni lo que él mismo dejó ahí cuando era el destino.
      - name: Pagina 1
        env:
          PAGE2_TOKEN: ${{ secrets.PAGE2_TOKEN }}
        run: |
          echo "PAGE_ID_MAIN=179820098545682" >> "$GITHUB_ENV"
          echo "Página 1 (origen, donde escribís): Universo Reality Tv Mexico Lives (179820098545682)."
          if [ -n "$PAGE2_TOKEN" ]; then
            echo "::add-mask::$PAGE2_TOKEN"
            echo "PAGE_TOKEN_MAIN=$PAGE2_TOKEN" >> "$GITHUB_ENV"
          fi
          # Instagram (@universorealityvip) cuelga de Mexico Lives, que ahora
          # vuelve a ser la que se lee: la cuenta se busca en esta misma página.
          echo "IG_PAGINA=179820098545682" >> "$GITHUB_ENV"

      # Página 2 (la que PUBLICA): Universo Reality. Su llave no está en ningún
      # secreto suelto: sale de las llaves frescas que el bot deriva de
      # USER_TOKEN al arrancar, pidiéndola de a una porque esta página no
      # aparece en la lista general de Facebook.
      - name: Pagina 2
        run: |
          echo "PAGE_ID_BACKUP=901214443065966" >> "$GITHUB_ENV"
          echo "Página 2 (publica): Universo Reality (901214443065966)."

      # Siempre se parte de la ÚLTIMA versión del estado que hay en el
      # repositorio, no de la del commit con el que arrancó este turno.
      # Motivo: las corridas programadas se crean con la foto del repositorio
      # del momento en que entran a la cola, y como el turno anterior dura casi
      # una hora, esa foto ya está vieja cuando por fin arrancan. Si se
      # restaurara de ahí, el turno no se enteraría de lo que publicó el turno
      # anterior y lo volvería a publicar (posts duplicados).
      - name: Restore state
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main || true
          if git show origin/main:data/store.b64 > "$RUNNER_TEMP/remote.b64" 2>/dev/null; then
            cp "$RUNNER_TEMP/remote.b64" data/store.b64
            echo "Estado tomado de la última versión del repositorio."
          else
            echo "No se pudo leer el estado remoto; se usa el del commit."
          fi
          python tools/pack.py unpack

      # Paso corto y aparte: su log se ve al instante, sin esperar al proceso
      # largo. Nunca corta el turno aunque falle.
      - name: Check
        continue-on-error: true
        run: python tools/diag.py

      - name: Run
        env:
          # El turno dura 5 h 50 min y el job corta a las 5 h 55: sobra
          # margen para que el cierre y el guardado terminen tranquilos.
          # Turnos largos = menos relevos = menos ocasiones de que el
          # relevo no arranque. GitHub permite hasta 6 h por turno.
          MAX_RUNTIME_SECONDS: "21000"
          # Avisa por Telegram cuando arranca y cuando cierra cada turno. Con
          # turnos de 6 h son 8 avisos al día, y sirven de señal de vida: si
          # llega el 🔴 de cierre y en un par de minutos no llega el 🟢 del
          # relevo, es que el relevo no arrancó.
          QUIET_LIFECYCLE: "0"
          # La misma llave del relevo, ahora también adentro del proceso: la
          # usa el botón 🔄 Reiniciar del chat para pedirle a GitHub un turno
          # nuevo antes de cerrar este. Si falta, el reinicio igual funciona
          # (se cierra el turno y entra el relevo ya encolado).
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          # Voz en off de los reels. Si el secreto no está, no pasa nada malo:
          # el bot sigue publicando fotos como siempre.
          VOZ_API_KEY: ${{ secrets.VOZ_API_KEY }}
          # Llave SOLO para Instagram. Va aparte de la de la página a propósito:
          # publicar en Instagram pide dos permisos más (instagram_basic e
          # instagram_content_publish) y metérselos a la llave que hoy publica
          # en Facebook significaría rehacerla, con el riesgo de dejar la página
          # muda. Así, si esta falla o vence, Facebook sigue igual y lo único
          # que se pierde es la copia en Instagram. Si el secreto no está, se
          # prueba con la de la página por si ya tuviera los permisos.
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # Llave de USUARIO, la larga (60 días). Con esto puesto el bot se
          # fabrica solo las llaves de las dos páginas en cada arranque, y las
          # de los secretos quedan de respaldo.
          #
          # Se agregó después de perder una mañana con esto: las llaves de
          # página que da el Explorador de la API duran un par de horas y el bot
          # se cae con "Session has expired" (190/463). Las que salen de
          # /me/accounts con una llave de usuario larga no vencen. Además, ahora
          # hay UNA sola llave que renovar cada 60 días en vez de tres.
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          # INSTAGRAM=0 apaga la publicación en Instagram sin tocar código.
          INSTAGRAM: ${{ vars.INSTAGRAM || '1' }}
          # Nombre de la voz clonada en el panel de ai33.pro.
          VOZ_NOMBRE: "VEXVIP"
          # La marca que decide el formato. Antes el video se repartía por
          # turnos (uno de cada tres); ahora no se sortea, se pide: si el
          # original de la página 1 lleva esta marca en el texto, esa
          # publicación sale en video en la página 2; si no la lleva, sale en
          # foto. Los videos rinden bastante menos que las fotos, así que el
          # video pasó a ser la excepción elegida a mano.
          #
          # La marca se busca como palabra entera (#UR no se confunde con
          # #URTV) y se borra del texto antes de publicar: es una orden interna
          # para el bot, no parte de la descripción. El botón 🎬 del panel
          # sigue mandando por encima de esto.
          #
          # Ojo con lo que NO cambia esto: de la página 1 se toman SOLO las
          # fotos. Los posts que allá son video se siguen saltando enteros, y
          # así se quedan. El video de la página 2 se arma siempre a partir de
          # la foto del post, moviéndola; nunca se usa un clip ajeno.
          ETIQUETA_VIDEO: "#UR"
          # La marca que APARTA el post. Si el original de la página 1 la
          # lleva, se prepara todo igual —la imagen y la descripción, y el
          # video si además lleva #UR— pero no se publica en ningún lado: se
          # manda al chat de Telegram y ahí termina. Es material para otra
          # página, que pasa por el mismo molde pero no va a la página 2.
          #
          # Se busca como palabra entera y se borra del texto antes de armar
          # nada, igual que #UR. Dejándola vacía, la regla se apaga entera y
          # todo vuelve a publicarse como siempre.
          ETIQUETA_APARTE: "#topchefvip5"
          # FRENO DE MANO. En 1, el bot NO publica nada en automático: prepara
          # todo igual —imagen, descripción y video si lleva #UR— y te lo manda
          # al chat de Telegram para que lo subas a mano. Facebook e Instagram
          # no se tocan.
          #
          # Hoy va en 1 a propósito: la cuenta de Meta que creó la app quedó en
          # revisión, y con eso todas las llaves están congeladas (error 190,
          # subcode 459). Publicar automático no es una opción hasta que se
          # resuelva. Cuando la cuenta vuelva, se pone en 0 y todo sigue como
          # antes. Ojo: mientras la cuenta esté congelada tampoco va a llegar
          # nada al chat, porque el bot ni siquiera puede LEER la página 1.
          #
          # Se puede cambiar sin tocar el código: alcanza con crear la variable
          # de repositorio SOLO_TELEGRAM (Settings → Secrets and variables →
          # Actions → Variables) con el valor 0 o 1; lo que diga ahí manda.
          SOLO_TELEGRAM: ${{ vars.SOLO_TELEGRAM || '1' }}
          # Llave de la SUSCRIPCIÓN de Claude, y la ÚNICA forma en que este bot
          # habla con Claude. El texto (las frases sobre la foto, la descripción
          # y el guion del video) se pide con esto, que ya está pagado en el
          # plan. La API de Anthropic no se usa más: el código que la usaba se
          # borró, no quedó apagado.
          #
          # Se genera con `claude setup-token` en la computadora y se pega acá
          # como secreto. Dura un año.
          #
          # Sin esta llave el bot no puede escribir nada, así que si falta, el
          # turno se cae en el arranque con el motivo a la vista (runner.py la
          # exige) en vez de quedarse seis horas fallando post por post.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python runner.py

      # Guardado final del turno. El runner ya va guardando en cada ciclo;
      # esto es el cierre, por si el último ciclo alcanzó a publicar algo.
      # Nunca pisa lo que haya en el repositorio: lo UNE (ver tools/guardar.sh).
      - name: Save state
        if: always()
        run: bash tools/guardar.sh
